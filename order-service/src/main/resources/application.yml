server:
  port: 8083

spring:
  application:
    name: order-service
  # Defaults target the compose MySQL published on localhost:3307 (see docker-compose.yml).
  # Inside compose, DB_HOST/DB_PORT/DB_PASSWORD are set by the environment.
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/orders_db
    username: ${DB_USER:order_svc}
    password: ${DB_PASSWORD:order_svc_dev_pw}

  # Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it matches.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100

shop:
  jwt:
    # HS256 key shared by all services (design D23). No default here: a service without
    # JWT_SECRET (at least 32 bytes) refuses to start. Compose supplies a local dev value.
    secret: ${JWT_SECRET:}

management:
  endpoint:
    health:
      show-components: always
