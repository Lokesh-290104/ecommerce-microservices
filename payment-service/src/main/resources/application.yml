server:
  port: 8084

spring:
  application:
    name: payment-service
  # Defaults target the compose MySQL published on localhost:3307 (see docker-compose.yml).
  # Inside compose, DB_HOST/DB_PORT/DB_PASSWORD are set by the environment.
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/payments_db
    username: ${DB_USER:payment_svc}
    password: ${DB_PASSWORD:payment_svc_dev_pw}

  # Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it matches.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

shop:
  payments:
    # Demo switch (design D16): delay every POST /api/payments response by this many ms, AFTER
    # the payment is committed, to reproduce "the charge went through but the caller timed out".
    response-delay-ms: ${PAYMENT_RESPONSE_DELAY_MS:0}
  jwt:
    # HS256 key shared by all services (design D23). No default here: a service without
    # JWT_SECRET (at least 32 bytes) refuses to start. Compose supplies a local dev value.
    secret: ${JWT_SECRET:}

management:
  endpoint:
    health:
      show-components: always
