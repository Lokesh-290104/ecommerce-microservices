# One MySQL container with one schema per service, plus the four services.
# Run from WSL (Docker lives there):  docker compose up -d --build
# Every published port binds to 127.0.0.1 only. Passwords default to local dev values;
# override them in a .env file (see .env.example).
name: shop

x-service: &service
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy

x-health: &health
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 60s

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_pw}
      USER_SVC_DB_PASSWORD: ${USER_SVC_DB_PASSWORD:-user_svc_dev_pw}
      PRODUCT_SVC_DB_PASSWORD: ${PRODUCT_SVC_DB_PASSWORD:-product_svc_dev_pw}
      ORDER_SVC_DB_PASSWORD: ${ORDER_SVC_DB_PASSWORD:-order_svc_dev_pw}
      PAYMENT_SVC_DB_PASSWORD: ${PAYMENT_SVC_DB_PASSWORD:-payment_svc_dev_pw}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP ping: the init phase runs with networking off, so this only passes once
      # the init script has finished and the real server is listening.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  user-service:
    <<: *service
    build: ./user-service
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_PASSWORD: ${USER_SVC_DB_PASSWORD:-user_svc_dev_pw}
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]

  product-service:
    <<: *service
    build: ./product-service
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_PASSWORD: ${PRODUCT_SVC_DB_PASSWORD:-product_svc_dev_pw}
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]

  order-service:
    <<: *service
    build: ./order-service
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_PASSWORD: ${ORDER_SVC_DB_PASSWORD:-order_svc_dev_pw}
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]

  payment-service:
    <<: *service
    build: ./payment-service
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_PASSWORD: ${PAYMENT_SVC_DB_PASSWORD:-payment_svc_dev_pw}
    ports:
      - "127.0.0.1:8084:8084"
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]

volumes:
  mysql-data:
