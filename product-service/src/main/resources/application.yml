server:
  port: 8082

spring:
  application:
    name: product-service
  # Defaults target the compose MySQL published on localhost:3307 (see docker-compose.yml).
  # Inside compose, DB_HOST/DB_PORT/DB_PASSWORD are set by the environment.
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/products_db
    username: ${DB_USER:product_svc}
    password: ${DB_PASSWORD:product_svc_dev_pw}

  # Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it matches.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100

management:
  endpoint:
    health:
      show-components: always
