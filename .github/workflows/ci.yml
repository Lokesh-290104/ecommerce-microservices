name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit tests, then the *IT tests against real MySQL (Testcontainers uses the runner's Docker).
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/target/*-reports/'
          retention-days: 7

  # The headline demo as a test (design D19): the whole stack in Docker, payment-service stopped
  # mid-checkout, and the order must still settle to PAID on its own once payments is back.
  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build jars and images
        run: scripts/build.sh -DskipTests

      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 300

      - name: Outage demo (asserts 201, then 202 while payments is down, then PAID with stock committed)
        run: scripts/demo-outage.sh

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs
          path: compose-logs.txt
          retention-days: 7

  # Images for every service on GitHub Container Registry, for main only (design should-have 1).
  publish:
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build jars and images
        run: scripts/build.sh -DskipTests

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images (tagged with the commit and latest)
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for svc in user-service product-service order-service payment-service; do
            for tag in "${GITHUB_SHA::7}" latest; do
              docker tag "shop-$svc" "ghcr.io/$owner/shop-$svc:$tag"
              docker push "ghcr.io/$owner/shop-$svc:$tag"
            done
          done
