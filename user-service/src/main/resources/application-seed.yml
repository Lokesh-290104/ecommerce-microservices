# One-off seeding for benchmarks (step 8): docker compose run --rm -e SPRING_PROFILES_ACTIVE=seed user-service
# Runs the seeder, then exits (no web server). Batched inserts are rewritten into multi-row INSERTs.
spring:
  main:
    web-application-type: none
  datasource:
    hikari:
      data-source-properties:
        rewriteBatchedStatements: true
